<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Meeting Prep Agent</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Meeting Prep Agent</div>
            <ul>
                <li><a href="login.html" class="active">Login</a></li>
                <li><a href="signup.html">Signup</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="form-card" style="max-width: 400px; margin: 2rem auto;">
            <h2>Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginIdentifier">Username or Email:</label>
                    <input type="text" id="loginIdentifier" required placeholder="Enter username or email">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password:</label>
                    <input type="password" id="loginPassword" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn primary-btn" style="width: 100%; background: #3498db; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer;">Login</button>
            </form>
            <p style="text-align: center; margin-top: 1rem;">
                Don't have an account? <a href="signup.html" style="color: #3498db; text-decoration: none;">Signup here</a>
            </p>
        </div>
    </main>

    <div id="toastContainer"></div>
    <script src="js/main.js"></script>
</body>
</html>
