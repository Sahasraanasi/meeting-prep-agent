<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - Meeting Prep Agent</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/authGuard.js"></script>
</head>
<body>
    <header>
        <nav>
            <div class="logo">Meeting Prep Agent</div>
            <ul>
                <li><a href="login.html">Login</a></li>
                <li><a href="signup.html" class="active">Signup</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="form-card" style="max-width: 400px; margin: 2rem auto;">
            <h2>Create Account</h2>
            <form id="signupForm">
                <div class="form-group">
                    <label for="signupUsername">Username:</label>
                    <input type="text" id="signupUsername" required placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label for="signupEmail">Email:</label>
                    <input type="email" id="signupEmail" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="signupPassword">Password:</label>
                    <input type="password" id="signupPassword" required placeholder="Create a password">
                </div>
                <button type="submit" class="btn primary-btn" style="width: 100%; background: #3498db; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer;">Signup</button>
            </form>
            <p style="text-align: center; margin-top: 1rem;">
                Already have an account? <a href="login.html" style="color: #3498db; text-decoration: none;">Login here</a>
            </p>
        </div>
    </main>

    <div id="toastContainer"></div>
    <script src="js/main.js"></script>
</body>
</html>
