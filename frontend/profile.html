<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Prep Agent - Profile</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Additional form styling */
        .form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #2c3e50;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        .form-group input:disabled {
            background-color: #f1f5f9;
            color: #64748b;
            cursor: not-allowed;
        }
        .container {
            text-align: left;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <header>
        <h1>Meeting Prep Agent</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="profile.html" class="active">Profile</a></li>
                <li><a href="contacts.html">Contacts</a></li>
                <li><a href="meeting.html">Meeting Notes</a></li>
                <li><a href="brief.html">Meeting Brief</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="container">
        <h2>User Profile</h2>
        <p>Set up your professional details to personalize your meeting preparation briefs.</p>
        
        <form id="profileForm">
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required placeholder="e.g. Alex Johnson" disabled>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required placeholder="e.g. alex@example.com" disabled>
            </div>
            
            <div class="form-group">
                <label for="company">Company:</label>
                <input type="text" id="company" name="company" required placeholder="e.g. Acme Corp" disabled>
            </div>
            
            <div class="form-group">
                <label for="role">Role / Job Title:</label>
                <input type="text" id="role" name="role" required placeholder="e.g. Product Manager" disabled>
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 1.5rem;">
                <button type="button" id="editProfileBtn" class="btn" style="background: #3b82f6; color: white; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer;">Edit Profile</button>
                <button type="submit" id="saveProfileBtn" class="btn" style="display: none; background: #10b981; color: white; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer;">Save Changes</button>
            </div>
        </form>
        <p id="successMessage" style="color: green; margin-top: 1rem; display: none; font-weight: 600;">Profile saved successfully!</p>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
