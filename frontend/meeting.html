<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Notes - Meeting Prep Agent</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
            color: #2c3e50;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        .form-group textarea {
            resize: vertical;
            height: 120px;
        }
        .container {
            text-align: left;
            max-width: 800px;
        }
        .meeting-card {
            background: #fdfdfd;
            border: 1px solid #e1e8ed;
            padding: 1.2rem;
            border-radius: 6px;
            margin-top: 1.5rem;
        }
        .meeting-card h4 {
            color: #2c3e50;
            margin-bottom: 0.4rem;
        }
    </style>
    <script src="js/authGuard.js"></script>
</head>
<body>
    <header>
        <nav>
            <div class="logo">Meeting Prep Agent</div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="contacts.html">Contacts</a></li>
                <li><a href="meeting.html" class="active">Meeting Notes</a></li>
                <li><a href="brief.html">Briefs</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h2>Record & Summarize Meeting</h2>
        
        <form id="meetingForm" class="form-card">
            <div class="form-group">
                <label for="meetingTitle">Meeting Title:</label>
                <input type="text" id="meetingTitle" required placeholder="e.g., Q3 Strategy Alignment">
            </div>

            <div class="form-group">
                <label for="meetingDate">Date & Time:</label>
                <input type="datetime-local" id="meetingDate" required>
            </div>

            <div class="form-group">
                <label for="contactSelect">Select Contact:</label>
                <select id="contactSelect" required>
                    <option value="">-- Choose a Contact --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="meetingNotes">Raw Meeting Notes:</label>
                <textarea id="meetingNotes" rows="6" required placeholder="Type or paste raw meeting notes here..."></textarea>
            </div>

            <!-- 1. Generate Summary Button -->
            <div class="form-group">
                <button type="button" id="generateSummaryBtn" class="btn secondary-btn" style="background:#f39c12; color:white; border:none; padding:10px 18px; border-radius:4px; cursor:pointer;">Generate Summary</button>
            </div>

            <!-- 2. AI / Structured Summary -->
            <div class="form-group">
                <label for="meetingSummary">AI / Structured Summary:</label>
                <textarea id="meetingSummary" rows="5" placeholder="Summary will be generated or can be typed here..."></textarea>
            </div>

            <!-- 3. Save Meeting Button -->
            <div class="form-group">
                <button type="submit" class="btn primary-btn" style="background:#3498db; color:white; border:none; padding:10px 18px; border-radius:4px; cursor:pointer;">Save Meeting</button>
            </div>
        </form>

        <section class="meetings-section" style="margin-top: 2rem;">
            <h3>Saved Meetings</h3>
            <div id="meetingsList" class="grid-container"></div>
        </section>
    </main>

    <!-- Toast Notification Container -->
    <div id="toastContainer"></div>

    <script src="../js/main.js"></script>
</body>
</html>
