<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Prep Agent - Meeting Notes</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
            color: #2c3e50;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        .form-group textarea {
            resize: vertical;
            height: 120px;
        }
        .container {
            text-align: left;
            max-width: 800px;
        }
        .meeting-card {
            background: #fdfdfd;
            border: 1px solid #e1e8ed;
            padding: 1.2rem;
            border-radius: 6px;
            margin-top: 1.5rem;
        }
        .meeting-card h4 {
            color: #2c3e50;
            margin-bottom: 0.4rem;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <header>
        <h1>Meeting Prep Agent</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="contacts.html">Contacts</a></li>
                <li><a href="meeting.html" class="active">Meeting Notes</a></li>
                <li><a href="brief.html">Meeting Brief</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="container">
        <h2>Meeting Notes & Summary</h2>
        <p>Record your meeting details, select a contact, and capture notes.</p>
        
        <form id="meetingForm" style="margin-top: 1.5rem;">
            <div class="form-group">
                <label for="meetingTitle">Meeting Title:</label>
                <input type="text" id="meetingTitle" required placeholder="e.g. Q3 Product Strategy Review">
            </div>

            <div class="form-group">
                <label for="meetingDate">Date & Time:</label>
                <input type="datetime-local" id="meetingDate" required>
            </div>

            <div class="form-group">
                <label for="contactSelect">Select Contact:</label>
                <select id="contactSelect" required>
                    <option value="">-- Choose a Contact --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="meetingNotes">Raw Meeting Notes:</label>
                <textarea id="meetingNotes" required placeholder="Type or paste raw meeting notes here..."></textarea>
            </div>

            <div class="form-group">
                <label for="meetingSummary">AI / Structured Summary:</label>
                <textarea id="meetingSummary" placeholder="Summary will be generated or can be typed here..."></textarea>
            </div>

            <button type="button" id="generateSummaryBtn" class="btn" style="background-color: #e67e22; margin-right: 0.5rem;">Generate Summary</button>
            <button type="submit" class="btn">Save Meeting</button>
        </form>

        <div id="savedMeetingsContainer" style="margin-top: 2rem;">
            <h3>Saved Meetings</h3>
            <div id="meetingsList" style="margin-top: 1rem;">
                <p style="color: #7f8c8d;">No meetings saved yet.</p>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
